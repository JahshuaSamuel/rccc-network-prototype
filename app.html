<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RCCC Network</title>
  <meta name="description" content="One shared platform for every Republican County Central Committee in California: the public website, member tools, candidate sites, field work and meetings.">
  <style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" id="topbar">
    <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>

    <a class="wordmark" href="#/overview" aria-label="Home">
      <svg class="wordmark-star" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="var(--brand-ink)"/>
        <path d="M16 5.5l3.1 6.6 7.2.9-5.3 5 1.4 7.1L16 21.6l-6.4 3.5 1.4-7.1-5.3-5 7.2-.9z" fill="var(--accent)"/>
      </svg>
      <span class="wordmark-text">
        <span class="wordmark-name" id="wordmark-name">SVGOP</span>
        <span class="wordmark-sub" id="wordmark-sub">Santa Clara County</span>
      </span>
    </a>

    <div class="spacer"></div>

    <div class="topbar-controls">
      <label class="switcher" data-tour="tenant-switcher">
        <span class="switcher-label">Committee</span>
        <select id="tenant-select" class="switcher-select" aria-label="Switch committee"></select>
      </label>
      <button class="btn btn-tour" id="start-tour" data-tour="start-tour">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M8.3 7l4.4 3-4.4 3z" fill="currentColor"/></svg>
        <span>Take the tour</span>
      </button>
      <div class="acct" id="account-slot" data-tour="role-switcher"></div>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" data-tour="nav" aria-label="Main">
      <div class="sidebar-inner">
      <div id="nav-list"></div>
      <div class="sidebar-foot small"><span class="sample-tag" title="Members, candidates, turfs and tallies on these screens are invented">Sample data</span><span>One platform, many committees. Each county runs its own site.</span></div>
      </div>
    </nav>
    <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div id="toasts" role="region" aria-label="Notifications" aria-live="polite" aria-relevant="additions"></div>

  <!-- Script order per contract. A missing file 404s and simply registers nothing. -->
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="store-supabase.js"></script>
  <script src="core.js"></script>
  <script src="auth.js"></script>
  <script src="auth-supabase.js"></script>
  <script src="crm.js"></script>
  <script src="voter-guide-data.js"></script>
  <script src="voter-guide.js"></script>
  <script src="screens/overview.js"></script>
  <script src="screens/public-hub.js"></script>
  <script src="screens/master.js"></script>
  <script src="screens/portal.js"></script>
  <script src="screens/candidate.js"></script>
  <script src="screens/field.js"></script>
  <script src="screens/governance.js"></script>
  <script src="screens/director.js"></script>
  <script src="newsroom-data.js"></script>
  <script src="screens/newsroom.js"></script>
  <script src="screens/account.js"></script>
  <script src="screens/people.js"></script>
  <script src="screens/outreach.js"></script>
  <script src="screens/mycampaign.js"></script>
  <script src="tour.js"></script>

</body></html>
